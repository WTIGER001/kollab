name: CD - Auto Deploy to DigitalOcean

on:
  push:
    branches:
      - main # Change this if your default branch is different (e.g., master)

# Serialize deployments without interrupting an active container replacement
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/kollab
            git fetch origin main
            git checkout --detach ${{ github.sha }}
            ./deploy.sh
