name: CD - Auto Deploy to DigitalOcean

on:
  push:
    branches:
      - main # Change this if your default branch is different (e.g., master)

# Serialize deployments without interrupting an active container replacement
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: caddy
            context: .
            dockerfile: ./Caddy.Dockerfile
          - image: media-preview
            context: ./media-preview
            dockerfile: ./media-preview/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Read the document converter revision
        if: matrix.image == 'media-preview'
        id: converter
        run: |
          revision=$(cat media-preview.ref)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned document converter
        if: matrix.image == 'media-preview'
        uses: actions/checkout@v4
        with:
          repository: WTIGER001/media-preview
          ref: ${{ steps.converter.outputs.revision }}
          path: media-preview
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/wtiger001/kollab-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/WTIGER001/kollab
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            umask 077
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            cd ~/kollab
            git fetch origin main
            git checkout --detach ${{ github.sha }}
            ./deploy.sh
