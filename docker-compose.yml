services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: arkollab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  go-backend:
    image: ghcr.io/wtiger001/kollab-api:${KOLLAB_RELEASE:-local}
    restart: always
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/arkollab?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      SYNC_SIGNING_KEY: ${SYNC_SIGNING_KEY:-}
      # Local accounts are the active authentication path for this deployment.
      AUTH_MODE: local
      PORT: 8080
      OFFICE_CONVERTER_URL: http://media-preview:8082/api/v1/preview
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - media-preview

  media-preview:
    image: ghcr.io/wtiger001/kollab-media-preview:${KOLLAB_RELEASE:-local}
    restart: always
    environment:
      PORT: 8082
      LIBREOFFICE_PATH: /usr/bin/soffice
    volumes:
      - ./uploads:/app/uploads

  caddy:
    image: ghcr.io/wtiger001/kollab-caddy:${KOLLAB_RELEASE:-local}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - go-backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
